<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALLY WEAR | Official Store</title>
    <style>
        :root { --main-bg: #000; --card-bg: #0a0a0a; --accent: #fff; --text-dim: #888; }
        body { background: var(--main-bg); color: var(--accent); font-family: 'Inter', sans-serif; margin: 0; }
        nav { padding: 25px; border-bottom: 1px solid #1a1a1a; text-align: center; font-weight: 900; letter-spacing: 8px; font-size: 1.5rem; }
        .hero { padding: 60px 20px; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .hero h1 { font-size: 3.5rem; margin: 0; line-height: 1; }
        .container { padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
        .card { background: var(--card-bg); border: 1px solid #111; border-radius: 0px; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: #333; }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .info { padding: 20px; }
        .info h3 { margin: 0 0 10px 0; font-size: 1.2rem; text-transform: uppercase; }
        .price { color: var(--text-dim); font-size: 1.1rem; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; background: var(--accent); color: var(--main-bg); text-align: center; text-decoration: none; font-weight: bold; font-size: 0.9rem; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <nav>MALLY WEAR</nav>
    <header class="hero">
        <h1>DROP 2026</h1>
        <p style="color: #444;">EXCLUSIVIDAD DESDE PARAGUAY</p>
    </header>
    <main class="container" id="catalog"></main>

    <script>
        async function fetchProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const catalog = document.getElementById('catalog');
            
            if(products.length === 0) {
                catalog.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>SIN STOCK DISPONIBLE ACTUALMENTE.</p>";
                return;
            }

            catalog.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p class="price">Gs. ${p.price.toLocaleString('es-PY')}</p>
                        <a href="/producto/${p.id}" class="btn">VER DETALLES</a>
                    </div>
                </div>
            `).join('');
        }
        window.onload = fetchProducts;
    </script>
</body>
</html>
