<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALLY WEAR | Detalle</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .product-page { max-width: 900px; margin: 40px auto; display: flex; gap: 40px; flex-wrap: wrap; }
        .product-page img { flex: 1; min-width: 300px; max-height: 600px; object-fit: cover; }
        .details { flex: 1; min-width: 300px; }
        .price { font-size: 2rem; margin: 20px 0; color: #888; }
        .sizes { display: flex; gap: 10px; margin: 20px 0; }
        .size-box { border: 1px solid #333; padding: 10px 20px; cursor: pointer; }
        .btn-add { background: #fff; color: #000; padding: 20px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
        a { color: #555; text-decoration: none; }
    </style>
</head>
<body>
    <a href="/">← VOLVER</a>
    <div class="product-page" id="product-content">
        </div>

    <script>
        const productId = window.location.pathname.split('/').pop();
        async function loadDetail() {
            const res = await fetch(`/api/product/${productId}`);
            const p = await res.json();
            const content = document.getElementById('product-content');
            
            content.innerHTML = `
                <img src="${p.img}">
                <div class="details">
                    <h1>${p.name}</h1>
                    <p class="price">Gs. ${p.price.toLocaleString('es-PY')}</p>
                    <p>TALLES DISPONIBLES:</p>
                    <div class="sizes">
                        ${p.sizes.split(',').map(s => `<div class="size-box">${s.trim()}</div>`).join('')}
                    </div>
                    <button class="btn-add" onclick="alert('Agregado al carrito')">AGREGAR AL CARRITO</button>
                </div>
            `;
        }
        loadDetail();
    </script>
</body>
</html>
