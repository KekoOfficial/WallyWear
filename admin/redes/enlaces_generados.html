<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces Generados - Mally Wear</title>
    <script src="../js/seguridad.js"></script>
    <link rel="stylesheet" href="../../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --bg: #f8f9fa;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .link-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f1f3f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .link-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
            background: white;
            color: #495057;
        }
        .btn-copy {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Enlaces Generados</h1>
            <a href="../3_redes_contacto.html" class="back-btn">← Volver a Redes</a>
        </div>

        <div class="card">
            <h2>Enlaces de Contacto del Sitio</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">
                Copia y comparte los enlaces directos a tus canales de venta y redes sociales:
            </p>

            <div id="enlaces-lista-container">
                <div class="link-row">
                    <strong style="width: 120px;">Tienda Principal:</strong>
                    <input type="text" id="link-tienda" class="link-input" readonly>
                    <button class="btn-copy" onclick="copyLink('link-tienda')">Copiar</button>
                </div>
                <div class="link-row">
                    <strong style="width: 120px;">WhatsApp Directo:</strong>
                    <input type="text" id="link-whatsapp" class="link-input" readonly>
                    <button class="btn-copy" onclick="copyLink('link-whatsapp')">Copiar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../public/js/utils.js"></script>
    <script>
        window.onload = async () => {
            const host = window.location.origin;
            document.getElementById("link-tienda").value = `${host}/public/tienda.html`;

            try {
                const config = await Utils.api.fetch("/api/whatsapp/config");
                if (config && config.numero) {
                    let cleanNum = config.numero.replace("INACTIVE:", "").replace("+", "");
                    document.getElementById("link-whatsapp").value = `https://wa.me/${cleanNum}`;
                } else {
                    document.getElementById("link-whatsapp").value = `Configura tu WhatsApp primero`;
                }
            } catch (e) {
                document.getElementById("link-whatsapp").value = `https://wa.me/595981000000`;
            }
        };

        function copyLink(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("📋 Enlace copiado al portapapeles");
        }
    </script>
</body>
</html>
