<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de WhatsApp de Pedidos - Mally Wear</title>
    <script src="../js/seguridad.js"></script>
    <link rel="stylesheet" href="../../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --bg: #f8f9fa;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .btn-save {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .status-toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 WhatsApp para Pedidos</h1>
            <a href="../3_redes_contacto.html" class="back-btn">← Volver a Redes</a>
        </div>

        <div class="card">
            <h2>Configurar Número Exclusivo</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">
                Ingresa el número exclusivo de WhatsApp donde los clientes enviarán sus IDs de pedidos y comprobantes. Formato: <strong>+5959XXXXXXXX</strong>
            </p>

            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Número de Celular:</label>
            <input type="text" id="numero-whatsapp" class="form-control" placeholder="+595981000000" pattern="^\+5959[0-9]{8}$">

            <div class="status-toggle-container">
                <span style="font-weight: bold; color: #495057;">Estado del Canal de Pedidos:</span>
                <label class="switch" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="whatsapp-activo" style="width: auto; margin: 0;" checked>
                    <span id="toggle-label" style="font-weight: bold;">Activo</span>
                </label>
            </div>

            <button class="btn-save" onclick="guardarWhatsAppConfig()">💾 Guardar Configuración</button>
        </div>
    </div>

    <script src="../../public/js/utils.js"></script>
    <script src="../js/whatsapp.js"></script>
</body>
</html>
