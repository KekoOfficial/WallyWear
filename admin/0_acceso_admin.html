<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Mally Wear</title>
    <link rel="stylesheet" href="../public/css/estilos_generales.css">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 400px;
            width: 90%;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #333;
        }
        .error {
            color: #dc3545;
            margin-top: 1rem;
            font-size: 0.9rem;
            height: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Panel de Control</h2>
        <div class="input-group">
            <label>Clave Maestra</label>
            <input type="password" id="pass-master" placeholder="••••••••">
        </div>
        <div class="input-group">
            <label>Clave de Verificación</label>
            <input type="password" id="pass-verif" placeholder="••••••••">
        </div>
        <button onclick="login()">Ingresar</button>
        <p id="error-msg" class="error"></p>
    </div>

    <script src="../public/js/utils.js"></script>
    <script>
        async function login() {
            const masterInput = document.getElementById('pass-master');
            const verifInput = document.getElementById('pass-verif');
            const errorMsg = document.getElementById('error-msg');

            const master = masterInput.value;
            const verif = verifInput.value;

            try {
                const response = await Utils.api.fetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ master, verif })
                });

                if (response.success) {
                    window.location.href = 'menu_principal.html';
                }
            } catch (err) {
                masterInput.value = '';
                verifInput.value = '';
                errorMsg.textContent = '❌ Acceso denegado';
                setTimeout(() => { errorMsg.textContent = ''; }, 3000);
            }
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
