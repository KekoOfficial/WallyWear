<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Catálogo - Wally Wear</title>
    <script src="../security/auth_check.js"></script>
    <link rel="stylesheet" href="../../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #007bff;
            --danger: #dc3545;
            --bg: #f4f7f6;
        }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; }

        section {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        h2 { margin-top: 0; border-bottom: 2px solid var(--bg); padding-bottom: 0.5rem; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .image-upload-box {
            border: 2px dashed #ddd;
            padding: 1rem;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
        }
        .image-upload-box:hover { border-color: var(--accent); }
        #preview-img { max-width: 150px; margin-top: 10px; border-radius: 8px; display: none; }

        .categoria-group { margin-top: 2rem; }
        .categoria-title {
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prod-item {
            display: grid;
            grid-template-columns: 80px 1fr auto auto;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .prod-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .prod-info h4 { margin: 0; }
        .prod-info p { margin: 5px 0 0; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Volver al Panel Principal</a>
        <h1>📦 Gestión de Catálogo</h1>

        <section>
            <h2>Crear Categoría</h2>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="nueva-cat" placeholder="Ej: Remeras, Calzado...">
                <button class="btn-accent" onclick="crearCategoria()">Crear</button>
            </div>
        </section>

        <section>
            <h2>Agregar Nuevo Producto</h2>
            <div class="form-grid">
                <input type="text" id="nombre" placeholder="Nombre del producto">
                <input type="number" id="precio" placeholder="Precio (Gs)">
                <input type="number" id="stock" placeholder="Stock Total">
                <input type="number" id="cantidad_prendas" placeholder="Unidades por lote">
                <select id="categoria-select">
                    <option value="" disabled selected>Seleccionar Categoría</option>
                </select>
            </div>

            <div class="image-upload-box" onclick="document.getElementById('input-foto').click()">
                <p id="upload-text">📸 Click para seleccionar imagen</p>
                <input type="file" id="input-foto" accept="image/*" style="display: none;" onchange="previsualizar(this)">
                <img id="preview-img">
                <input type="hidden" id="imagen-nombre">
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 1.5rem;" onclick="guardarProducto()">Guardar Producto</button>
        </section>

        <section>
            <h2>Lista de Productos por Categoría</h2>
            <div id="lista-categorias"></div>
        </section>
    </div>

    <script src="../../public/js/utils.js"></script>
    <script>
        window.onload = () => {
            renderCategorias();
            renderProductos();
        };

        function getCategorias() {
            return Utils.storage.get("categorias") || ["Remeras", "Zapatillas", "Pantalones"];
        }

        function renderCategorias() {
            const cats = getCategorias();
            const select = document.getElementById("categoria-select");
            select.innerHTML = '<option value="" disabled selected>Seleccionar Categoría</option>';
            cats.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
        }

        function crearCategoria() {
            const input = document.getElementById("nueva-cat");
            const nombre = input.value.trim();
            if (!nombre) return;

            const cats = getCategorias();
            if (cats.includes(nombre)) return alert("Esta categoría ya existe");

            cats.push(nombre);
            Utils.storage.set("categorias", cats);
            input.value = "";
            renderCategorias();
            renderProductos();
            alert("✅ Categoría creada");
        }

        function previsualizar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                const fileName = input.files[0].name;
                document.getElementById('imagen-nombre').value = fileName;

                reader.onload = (e) => {
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    img.style.display = 'inline-block';
                    document.getElementById('upload-text').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function guardarProducto() {
            const nombre = document.getElementById("nombre").value.trim();
            const precio = parseInt(document.getElementById("precio").value);
            const stock = parseInt(document.getElementById("stock").value);
            const unidades = parseInt(document.getElementById("cantidad_prendas").value);
            const categoria = document.getElementById("categoria-select").value;
            const imagen = document.getElementById("imagen-nombre").value;

            if (!nombre || isNaN(precio) || isNaN(stock) || isNaN(unidades) || !categoria || !imagen) {
                return alert("Por favor complete todos los campos y seleccione una imagen");
            }

            const productos = Utils.storage.get("productos") || [];
            productos.push({
                id: Date.now(),
                nombre,
                precio,
                stock,
                cantidadPrendas: unidades,
                categoria,
                imagen
            });

            Utils.storage.set("productos", productos);
            alert("✅ Producto guardado");
            location.reload();
        }

        function renderProductos() {
            const container = document.getElementById("lista-categorias");
            const productos = Utils.storage.get("productos") || [];
            const cats = getCategorias();

            container.innerHTML = "";

            cats.forEach(cat => {
                const catProds = productos.filter(p => p.categoria === cat);

                const group = document.createElement("div");
                group.className = "categoria-group";

                group.innerHTML = `
                    <div class="categoria-title">
                        <h3>${cat}</h3>
                        <small>${catProds.length} productos</small>
                    </div>
                `;

                if (catProds.length === 0) {
                    group.innerHTML += `<p style="padding: 10px; color: #999;">No hay productos en esta categoría</p>`;
                } else {
                    catProds.forEach(p => {
                        const item = document.createElement("div");
                        item.className = "prod-item";
                        item.innerHTML = `
                            <img src="../../public/img/${p.imagen}" onerror="this.src='https://via.placeholder.com/80?text=Error'">
                            <div class="prod-info">
                                <h4>${p.nombre}</h4>
                                <p>${Utils.formatCurrency(p.precio)} | Stock: ${p.stock} | Lote: ${p.cantidadPrendas}</p>
                            </div>
                            <button class="btn-danger" onclick="eliminarProducto(${p.id})">Eliminar</button>
                        `;
                        group.appendChild(item);
                    });
                }
                container.appendChild(group);
            });
        }

        function eliminarProducto(id) {
            if (!confirm("¿Seguro que desea eliminar este producto?")) return;
            let prods = Utils.storage.get("productos") || [];
            prods = prods.filter(p => p.id !== id);
            Utils.storage.set("productos", prods);
            renderProductos();
        }
    </script>
</body>
</html>
