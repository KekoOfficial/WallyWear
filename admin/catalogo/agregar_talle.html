<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Talles - Mally Wear</title>
    <script src="../js/seguridad.js"></script>
    <link rel="stylesheet" href="../../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --bg: #f8f9fa;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }
        .btn-save {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>➕ Agregar Talle a Producto</h1>
            <a href="editar_talles.html" class="back-btn">← Volver a Talles</a>
        </div>

        <div class="card">
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Selecciona Producto:</label>
            <select id="select-producto" class="form-control">
                <option value="">-- Selecciona un producto --</option>
            </select>

            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Escribe Talle a agregar (Ej: 38, L, M/L):</label>
            <input type="text" id="nuevo-talle-input" class="form-control" placeholder="Escribe un talle...">

            <button class="btn-save" onclick="guardarTalleUnico()">💾 Agregar Talle al Producto</button>
        </div>
    </div>

    <script src="../../public/js/utils.js"></script>
    <script>
        let productosList = [];

        window.onload = async () => {
            try {
                productosList = await Utils.api.fetch("/api/productos/");
                const select = document.getElementById("select-producto");
                productosList.forEach(p => {
                    const opt = document.createElement("option");
                    opt.value = p.id;
                    opt.textContent = `${p.nombre} (${p.categoria})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                alert("Error: " + err.message);
            }
        };

        async function guardarTalleUnico() {
            const prodId = document.getElementById("select-producto").value;
            const nuevoTalle = document.getElementById("nuevo-talle-input").value.trim();

            if (!prodId || !nuevoTalle) {
                alert("Por favor selecciona un producto e introduce un talle.");
                return;
            }

            const pSelected = productosList.find(p => p.id == prodId);
            if (!pSelected) return;

            let talles = [];
            try {
                talles = pSelected.talles || [];
                if (typeof talles === "string") {
                    talles = JSON.parse(talles);
                }
            } catch (e) {
                talles = [];
            }

            if (talles.includes(nuevoTalle)) {
                alert("Este talle ya existe en el producto seleccionado.");
                return;
            }

            talles.push(nuevoTalle);

            try {
                const response = await Utils.api.fetch(`/api/talles/producto/${prodId}`, {
                    method: 'POST',
                    body: JSON.stringify({ talles: talles })
                });

                if (response.success) {
                    alert("✅ Talle agregado exitosamente!");
                    document.getElementById("nuevo-talle-input").value = "";
                    // Refresh local storage/array
                    pSelected.talles = JSON.stringify(talles);
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }
    </script>
</body>
</html>
