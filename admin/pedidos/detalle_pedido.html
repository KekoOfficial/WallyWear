<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Pedido - Mally Wear</title>
    <script src="../js/seguridad.js"></script>
    <link rel="stylesheet" href="../../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --bg: #f8f9fa;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .value {
            color: #1a1a1a;
        }
        .comprobante-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #ddd;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 1.5rem;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-confirm {
            background: #28a745;
            color: white;
        }
        .btn-cancel {
            background: #dc3545;
            color: white;
        }
        .btn-items {
            background: #007bff;
            color: white;
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📑 Detalle del Pedido</h1>
            <a href="lista_pedidos.html" class="back-btn">← Lista de Pedidos</a>
        </div>

        <div id="detalle-container">
            <p>Cargando detalle del pedido...</p>
        </div>
    </div>

    <script src="../../public/js/utils.js"></script>
    <script src="../js/detalle_pedido.js"></script>
</body>
</html>
