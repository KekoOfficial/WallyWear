<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Mally Wear</title>
    <script src="js/seguridad.js"></script>
    <link rel="stylesheet" href="../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #007bff;
            --bg: #f8f9fa;
        }
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .admin-header {
            max-width: 1000px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .menu-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-decoration: none;
            color: var(--primary);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .menu-card h3 {
            margin: 0.5rem 0;
            font-size: 1.2rem;
        }
        .menu-card p {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>Mally Wear Admin</h1>
        <button onclick="logout()" class="logout-btn">Cerrar Sesión</button>
    </header>

    <main class="menu-grid">
        <a href="1_catalogo_productos.html" class="menu-card">
            <h3>📦 Gestión de Catálogo</h3>
            <p>Productos, stock y categorías</p>
        </a>
        <a href="2_pedidos_solicitudes.html" class="menu-card">
            <h3>📑 Gestión de Pedidos</h3>
            <p>Ver solicitudes y procesar pagos</p>
        </a>
        <a href="3_redes_contacto.html" class="menu-card">
            <h3>🌐 Redes Sociales</h3>
            <p>Configurar links de contacto</p>
        </a>
        <a href="4_contenido_sitio.html" class="menu-card">
            <h3>📝 Políticas y Contenido</h3>
            <p>Editar textos legales y del sitio</p>
        </a>
        <a href="5_configuracion_general.html" class="menu-card">
            <h3>⚙️ Configuraciones</h3>
            <p>Estado del sistema y seguridad</p>
        </a>
    </main>

    <script src="../public/js/utils.js"></script>
    <script>
        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '0_acceso_admin.html';
        }
    </script>
</body>
</html>
