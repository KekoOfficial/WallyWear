<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Wally Wear - Productos</title>
    <link rel="stylesheet" href="css/admin_productos.css">
</head>
<body>
    <div id="acceso-admin">
        <h2>Acceso Administrador</h2>
        <input type="password" id="input-id-admin" placeholder="Ingresar ID de acceso">
        <button onclick="verificarAcceso()">Ingresar</button>
    </div>

    <div id="panel" style="display: none;">
        <nav style="margin-bottom: 2rem; text-align: center;">
            <a href="1_panel_productos.html" style="margin: 0 10px;">Productos</a>
            <a href="2_panel_pedidos.html" style="margin: 0 10px;">Pedidos</a>
            <a href="../public/1_tienda.html" style="margin: 0 10px;">Ver Tienda</a>
        </nav>
        <h1>Gestión de Productos y Categorías</h1>

        <section>
            <h3>Crear nueva categoría</h3>
            <input type="text" id="nueva-cat" placeholder="Ej: Remeras, Zapatillas...">
            <button onclick="crearCategoria()">Crear</button>
        </section>

        <section>
            <h3>Agregar / Editar Producto</h3>
            <input type="text" id="nombre" placeholder="Nombre del producto">
            <input type="number" id="precio" placeholder="Precio en Gs">
            <input type="number" id="stock" placeholder="Cantidad en stock">
            <input type="text" id="imagen" placeholder="Nombre del archivo en carpeta img (ej: remera1.jpg)">
            <select id="categoria"></select>
            <button onclick="guardarProducto()">Guardar Producto</button>
        </section>

        <section>
            <h3>Lista de Productos</h3>
            <div id="lista-admin"></div>
        </section>
    </div>

    <script>
        const ID_SECRETA = "Wally2026";

        function verificarAcceso() {
            const ingreso = document.getElementById("input-id-admin").value.trim();
            if (ingreso === ID_SECRETA) {
                document.getElementById("acceso-admin").style.display = "none";
                document.getElementById("panel").style.display = "block";
                cargarCategorias();
                cargarProductosAdmin();
            } else {
                alert("❌ ID incorrecta");
            }
        }

        function cargarCategorias() {
            const cats = JSON.parse(localStorage.getItem("categorias")) || ["Remeras", "Zapatillas", "Pantalones"];
            const select = document.getElementById("categoria");
            select.innerHTML = "";
            cats.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
        }

        function crearCategoria() {
            const nombre = document.getElementById("nueva-cat").value.trim();
            if (!nombre) return alert("Escribe un nombre");
            const cats = JSON.parse(localStorage.getItem("categorias")) || [];
            if (cats.includes(nombre)) return alert("Ya existe");
            cats.push(nombre);
            localStorage.setItem("categorias", JSON.stringify(cats));
            cargarCategorias();
            alert("✅ Categoría creada");
        }

        function guardarProducto() {
            const nombre = document.getElementById("nombre").value.trim();
            const precio = parseInt(document.getElementById("precio").value);
            const stock = parseInt(document.getElementById("stock").value);
            const imagen = document.getElementById("imagen").value.trim();
            const categoria = document.getElementById("categoria").value;

            if (!nombre || !precio || !stock || !imagen) return alert("Completa todos los campos");

            const productos = JSON.parse(localStorage.getItem("productos")) || [];
            const nuevo = {
                id: Date.now(),
                nombre, precio, stock, imagen, categoria
            };
            productos.push(nuevo);
            localStorage.setItem("productos", JSON.stringify(productos));
            cargarProductosAdmin();
            alert("✅ Producto guardado");
        }

        function cargarProductosAdmin() {
            const contenedor = document.getElementById("lista-admin");
            const productos = JSON.parse(localStorage.getItem("productos")) || [];
            contenedor.innerHTML = "";

            productos.forEach(p => {
                contenedor.innerHTML += `
                    <div class="prod-admin">
                        <div class="prod-info">
                            <strong>${p.nombre}</strong> | ${p.categoria} <br>
                            Precio: Gs ${p.precio.toLocaleString()} | Stock: ${p.stock} <br>
                            Imagen: ${p.imagen}
                        </div>
                        <button onclick="eliminarProducto(${p.id})" style="background: #dc3545;">Eliminar</button>
                    </div>
                `;
            });
        }

        function eliminarProducto(id) {
            let productos = JSON.parse(localStorage.getItem("productos")) || [];
            productos = productos.filter(p => p.id !== id);
            localStorage.setItem("productos", JSON.stringify(productos));
            cargarProductosAdmin();
        }
    </script>
</body>
</html>
