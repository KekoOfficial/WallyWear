<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Wally Wear</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #1a1a1a; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a1a1a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; }
        .error { color: #dc3545; font-size: 0.9rem; text-align: center; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Panel de Control</h2>
        <div id="step1">
            <input type="password" id="pass1" placeholder="Contraseña Maestra">
            <button onclick="checkStep1()">Siguiente</button>
        </div>
        <div id="step2" style="display: none;">
            <input type="password" id="pass2" placeholder="Código de Verificación">
            <button onclick="checkStep2()">Ingresar</button>
        </div>
        <p id="error-msg" class="error">❌ Acceso denegado</p>
    </div>

    <script>
        const MASTER_PASS = "WallyMaster2026";
        const VERIFY_PASS = "WallyShop_777";

        function checkStep1() {
            const p1 = document.getElementById("pass1").value;
            if (p1 === MASTER_PASS) {
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
                document.getElementById("error-msg").style.display = "none";
            } else {
                showError();
            }
        }

        function checkStep2() {
            const p2 = document.getElementById("pass2").value;
            if (p2 === VERIFY_PASS) {
                sessionStorage.setItem("admin_auth", "true");
                window.location.href = "../products/index.html";
            } else {
                showError();
            }
        }

        function showError() {
            document.getElementById("error-msg").style.display = "block";
        }
    </script>
</body>
</html>
