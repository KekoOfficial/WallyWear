<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Wally Wear - Pedidos</title>
    <link rel="stylesheet" href="../css/admin_pedidos.css">
    <script src="../security/auth_check.js"></script>
</head>
<body>
    <div id="panel">
        <nav style="margin-bottom: 2rem; text-align: center;">
            <a href="../products/index.html" style="margin: 0 10px;">Productos</a>
            <a href="../orders/index.html" style="margin: 0 10px;">Pedidos</a>
            <a href="../social/index.html" style="margin: 0 10px;">Redes Sociales</a>
            <a href="../../public/catalog/index.html" style="margin: 0 10px;">Ver Tienda</a>
            <button onclick="sessionStorage.clear(); window.location.reload();" style="padding: 5px 10px; background: #c53030; border-radius: 4px; font-size: 0.8rem; width: auto; display: inline-block; vertical-align: middle;">Salir</button>
        </nav>
        <h1>Gestión de Pedidos</h1>
        <div id="lista-pedidos"></div>
    </div>

    <script>

        function cargarPedidos() {
            const contenedor = document.getElementById("lista-pedidos");
            let pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
            contenedor.innerHTML = "";

            // Ordenar de más reciente a más antiguo
            pedidos.sort((a, b) => {
                // Asumiendo que el ID tiene el timestamp o usando la fecha
                // Como PED-ID usa Date.now(), podemos extraerlo o simplemente confiar en el orden de creación si se insertan al final
                // Pero para estar seguros, si tenemos la fecha como string, mejor usar el ID si es PED-timestamp
                const timeA = parseInt(a.id.split('-')[1]);
                const timeB = parseInt(b.id.split('-')[1]);
                return timeB - timeA;
            });

            if (pedidos.length === 0) {
                contenedor.innerHTML = "<p>No hay pedidos registrados</p>";
                return;
            }

            pedidos.forEach((pedido, index) => {
                let detalle = pedido.productos.map(p => `${p.nombre} x${p.cantidad} = Gs ${(p.precio * p.cantidad).toLocaleString()}`).join("<br>");

                contenedor.innerHTML += `
                    <div class="pedido">
                        <h3>ID: ${pedido.id}</h3>
                        <p>Fecha: ${pedido.fecha}</p>
                        <p>Estado: <strong>${pedido.estado}</strong></p>
                        <p>Productos:<br>${detalle}</p>
                        <p>Total: Gs ${pedido.total.toLocaleString()}</p>
                        ${pedido.estado === "Pendiente de pago" ?
                            `<button onclick="confirmarPago('${pedido.id}')">✅ Confirmar pago recibido</button>` :
                            `<span>✅ Pago confirmado</span>`
                        }
                    </div>
                `;
            });
        }

        function confirmarPago(id) {
            const pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
            const index = pedidos.findIndex(p => p.id === id);
            if (index !== -1) {
                pedidos[index].estado = "Pago confirmado - En preparación";
                localStorage.setItem("pedidos", JSON.stringify(pedidos));
                cargarPedidos();
                alert("✅ Pedido confirmado correctamente");
            }
        }
        window.onload = cargarPedidos;
    </script>
</body>
</html>
