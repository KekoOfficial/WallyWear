<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Wally Wear</title>
    <script src="../security/auth_check.js"></script>
    <link rel="stylesheet" href="../../public/css/estilos_generales.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #28a745;
            --bg: #f4f7f6;
        }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #007bff; text-decoration: none; }

        .pedido-card {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
            border-left: 5px solid #ccc;
        }
        .pedido-card.confirmado { border-left-color: var(--accent); }
        .pedido-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .pedido-id { font-weight: bold; color: var(--primary); }
        .pedido-fecha { color: #666; font-size: 0.9rem; }

        .producto-linea { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.95rem; }
        .total-pedido { text-align: right; font-weight: bold; font-size: 1.1rem; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }

        .estado-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .pendiente { background: #fff3cd; color: #856404; }
        .confirmado-badge { background: #d4edda; color: #155724; }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Volver al Panel Principal</a>
        <h1>📑 Gestión de Pedidos</h1>
        <div id="pedidos-container"></div>
    </div>

    <script src="../../public/js/utils.js"></script>
    <script>
        window.onload = cargarPedidos;

        function cargarPedidos() {
            const container = document.getElementById("pedidos-container");
            const pedidos = Utils.storage.get("pedidos") || [];

            if (pedidos.length === 0) {
                container.innerHTML = "<p>No hay pedidos registrados.</p>";
                return;
            }

            // Ordenar por ID descendente (más recientes primero)
            pedidos.sort((a, b) => b.id.localeCompare(a.id));

            container.innerHTML = "";
            pedidos.forEach(pedido => {
                const isConfirmado = pedido.estado.includes("confirmado");
                const card = document.createElement("div");
                card.className = `pedido-card ${isConfirmado ? 'confirmado' : ''}`;

                let productosHTML = "";
                pedido.productos.forEach(p => {
                    productosHTML += `
                        <div class="producto-linea">
                            <span>${p.nombre} x${p.cantidad}</span>
                            <span>${Utils.formatCurrency(p.precio * p.cantidad)}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="pedido-header">
                        <div>
                            <span class="pedido-id">${pedido.id}</span><br>
                            <span class="pedido-fecha">${pedido.fecha}</span>
                        </div>
                        <span class="estado-badge ${isConfirmado ? 'confirmado-badge' : 'pendiente'}">
                            ${pedido.estado}
                        </span>
                    </div>
                    <div class="pedido-cuerpo">
                        ${productosHTML}
                        <div class="total-pedido">Total: ${Utils.formatCurrency(pedido.total)}</div>
                    </div>
                    ${!isConfirmado ?
                        `<button onclick="confirmarPedido('${pedido.id}')">✅ Confirmar pago y procesar pedido</button>` :
                        `<button disabled>Pedido Procesado</button>`
                    }
                `;
                container.appendChild(card);
            });
        }

        function confirmarPedido(id) {
            if (!confirm("¿Confirmar pago y descontar stock?")) return;

            const pedidos = Utils.storage.get("pedidos") || [];
            const productos = Utils.storage.get("productos") || [];
            const pIdx = pedidos.findIndex(p => p.id === id);

            if (pIdx === -1) return;

            const pedido = pedidos[pIdx];
            let errorStock = false;
            let productosNoDisponibles = [];

            // 1. Validar si hay stock para todos los productos
            pedido.productos.forEach(itemPedido => {
                const prodRef = productos.find(p => p.id === itemPedido.id);
                if (!prodRef || prodRef.stock < itemPedido.cantidad) {
                    errorStock = true;
                    productosNoDisponibles.push(itemPedido.nombre);
                }
            });

            if (errorStock) {
                return alert("⚠️ No hay stock suficiente para: " + productosNoDisponibles.join(", "));
            }

            // 2. Descontar stock
            pedido.productos.forEach(itemPedido => {
                const prodRef = productos.find(p => p.id === itemPedido.id);
                prodRef.stock -= itemPedido.cantidad;
            });

            // 3. Actualizar estado del pedido
            pedidos[pIdx].estado = "Pago confirmado - Finalizado";

            // 4. Guardar cambios
            Utils.storage.set("pedidos", pedidos);
            Utils.storage.set("productos", productos);

            alert("✅ Pago confirmado y stock actualizado.");
            cargarPedidos();
        }
    </script>
</body>
</html>
