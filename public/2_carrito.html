<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wally Wear - Carrito</title>
    <link rel="stylesheet" href="css/estilos_generales.css">
    <link rel="stylesheet" href="css/estilos_carrito.css">
    <link rel="stylesheet" href="css/estilos_responsivo.css">
</head>
<body>
    <header>
        <h1>Wally Wear</h1>
        <nav>
            <a href="1_tienda.html">Tienda</a>
            <a href="2_carrito.html">Carrito (<span id="contador-carrito">0</span>)</a>
            <a href="3_politica_privacidad.html">Políticas</a>
        </nav>
    </header>

    <main>
        <h2>Tu Carrito de Compras</h2>
        <div id="lista-carrito"></div>
        <div id="total-final"></div>
        <button id="btn-pedir" onclick="generarPedido()">Generar Pedido</button>
        <div id="resultado-pedido"></div>
    </main>

    <script src="js/utils.js"></script>
    <script>
        let carrito = Utils.storage.get("carrito") || [];

        window.onload = () => {
            Utils.updateCartCounter();
            mostrarCarrito();
        };

        function mostrarCarrito() {
            const contenedor = document.getElementById("lista-carrito");
            contenedor.innerHTML = "";
            let total = 0;

            if (carrito.length === 0) {
                contenedor.innerHTML = "<p>Tu carrito está vacío</p>";
                return;
            }

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                contenedor.innerHTML += `
                    <div class="item-carrito">
                        <h4>${item.nombre}</h4>
                        <p>Precio: ${Utils.formatCurrency(item.precio)}</p>
                        <p>Cantidad: ${item.cantidad}</p>
                        <p>Subtotal: ${Utils.formatCurrency(subtotal)}</p>
                        <button onclick="quitarDelCarrito(${index})">Quitar uno</button>
                    </div>
                `;
            });

            document.getElementById("total-final").innerHTML = `<h3>Total a pagar: ${Utils.formatCurrency(total)}</h3>`;
        }

        function quitarDelCarrito(index) {
            if (carrito[index].cantidad > 1) carrito[index].cantidad--;
            else carrito.splice(index, 1);
            Utils.storage.set("carrito", carrito);
            mostrarCarrito();
            Utils.updateCartCounter();
        }

        function generarPedido() {
            if (carrito.length === 0) return alert("El carrito está vacío");
            
            const idPedido = "PED-" + Date.now();
            const pedidos = Utils.storage.get("pedidos") || [];
            
            pedidos.push({
                id: idPedido,
                fecha: new Date().toLocaleString(),
                productos: carrito,
                total: carrito.reduce((a, b) => a + (b.precio * b.cantidad), 0),
                estado: "Pendiente de pago"
            });

            Utils.storage.set("pedidos", pedidos);
            Utils.storage.remove("carrito");
            carrito = [];
            mostrarCarrito();
            Utils.updateCartCounter();

            document.getElementById("resultado-pedido").innerHTML = `
                <div class="aviso">
                    ✅ Pedido creado con éxito<br>
                    <strong>Tu ID de pedido: ${idPedido}</strong><br>
                    Envía la captura de transferencia y este ID por WhatsApp para confirmar tu compra.
                </div>
            `;
        }
    </script>
</body>
</html>
