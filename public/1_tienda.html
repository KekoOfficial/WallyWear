<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wally Wear - Tienda Oficial</title>
    <link rel="stylesheet" href="css/estilos_generales.css">
    <link rel="stylesheet" href="css/estilos_tienda.css">
    <link rel="stylesheet" href="css/estilos_responsivo.css">
</head>
<body>
    <header>
        <h1>Wally Wear</h1>
        <nav>
            <a href="1_tienda.html">Tienda</a>
            <a href="2_carrito.html">Carrito (<span id="contador">0</span>)</a>
            <a href="3_politica_privacidad.html">Políticas</a>
            <a href="../admin/index.html">Acceso Admin</a>
        </nav>
    </header>

    <main id="contenedor-tienda">
        <!-- Las categorías y productos se cargarán dinámicamente -->
    </main>

    <script src="js/utils.js"></script>
    <script src="js/footer.js"></script>
    <script>
        let carrito = Utils.getLocalStorage("carrito");
        Utils.updateCartCounter();

        function cargarProductos() {
            const productos = Utils.getLocalStorage("productos");
            const categorias = Utils.getLocalStorage("categorias", ["Remeras", "Zapatillas", "Pantalones"]);
            const contenedor = document.getElementById("contenedor-tienda");
            contenedor.innerHTML = "";

            if (productos.length === 0) {
                contenedor.innerHTML = `
                    <div style="text-align: center; margin-top: 5rem;">
                        <h2>¡Próximamente!</h2>
                        <p>Estamos preparando nuestra nueva colección. Vuelve pronto.</p>
                    </div>
                `;
                return;
            }

            categorias.forEach(cat => {
                const productosCat = productos.filter(p => p.categoria === cat);
                if (productosCat.length === 0) return;

                const section = document.createElement("section");
                section.className = "categoria";
                section.id = `cat-${cat.toLowerCase().replace(/\s+/g, '-')}`;

                section.innerHTML = `
                    <h2>${cat}</h2>
                    <div class="productos-lista"></div>
                `;

                const lista = section.querySelector(".productos-lista");
                productosCat.forEach(p => {
                    lista.innerHTML += `
                        <div class="producto">
                            <img src="img/${p.imagen}" alt="${p.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                            <h3>${p.nombre}</h3>
                            <p>Precio: ${Utils.formatCurrency(p.precio)}</p>
                            <p>Stock: ${p.stock > 0 ? p.stock : '<span style="color:red">Agotado</span>'}</p>
                            <button onclick="agregar(${p.id})" ${p.stock < 1 ? "disabled" : ""}>
                                ${p.stock < 1 ? "Sin stock" : "Agregar al carrito"}
                            </button>
                        </div>
                    `;
                });

                contenedor.appendChild(section);
            });
        }

        function agregar(id) {
            const productos = Utils.getLocalStorage("productos");
            const prod = productos.find(x => x.id === id);

            if (!prod || prod.stock < 1) return;

            const existe = carrito.find(x => x.id === id);
            if (existe) {
                if (existe.cantidad < prod.stock) {
                    existe.cantidad++;
                } else {
                    return alert("Lo sentimos, no hay más stock disponible de este producto.");
                }
            } else {
                carrito.push({...prod, cantidad: 1});
            }

            Utils.setLocalStorage("carrito", carrito);
            Utils.updateCartCounter();
            alert("✅ Agregado al carrito");
        }

        window.onload = cargarProductos;
    </script>
</body>
</html>
