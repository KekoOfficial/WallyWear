<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wally Wear - Tienda</title>
    <link rel="stylesheet" href="css/estilos_generales.css">
    <link rel="stylesheet" href="css/estilos_tienda.css">
    <link rel="stylesheet" href="css/estilos_responsivo.css">
</head>
<body>
    <header>
        <h1>Wally Wear</h1>
        <nav>
            <a href="1_tienda.html">Tienda</a>
            <a href="2_carrito.html">Carrito (<span id="contador">0</span>)</a>
            <a href="3_politica_privacidad.html">Políticas</a>
            <a href="../admin/1_panel_productos.html">Acceso Admin</a>
        </nav>
    </header>

    <main id="contenedor-tienda">
        <!-- Las categorías y productos se cargarán dinámicamente -->
    </main>

    <script src="js/utils.js"></script>
    <script src="js/footer.js"></script>
    <script>
        let carrito = Utils.storage.get("carrito") || [];

        window.onload = () => {
            Utils.updateCartCounter();
            cargarProductos();
        };

        function cargarProductos() {
            const productos = Utils.storage.get("productos") || [];
            const categorias = Utils.storage.get("categorias") || ["Remeras", "Zapatillas", "Pantalones"];
            const contenedor = document.getElementById("contenedor-tienda");
            contenedor.innerHTML = "";

            categorias.forEach(cat => {
                const productosCat = productos.filter(p => p.categoria === cat);
                if (productosCat.length === 0) return;

                const section = document.createElement("section");
                section.className = "categoria";
                section.id = `cat-${cat.toLowerCase().replace(/\s+/g, '-')}`;

                section.innerHTML = `
                    <h2>${cat}</h2>
                    <div class="productos-lista"></div>
                `;

                const lista = section.querySelector(".productos-lista");
                productosCat.forEach(p => {
                    lista.innerHTML += `
                        <div class="producto">
                            <img src="img/${p.imagen}" alt="${p.nombre}">
                            <h3>${p.nombre}</h3>
                            <p class="precio">${Utils.formatCurrency(p.precio)}</p>
                            <p class="meta">Stock: ${p.stock} | Unidades: ${p.cantidadPrendas || 1}</p>
                            <button onclick="agregar(${p.id})" ${p.stock < 1 ? "disabled" : ""}>
                                ${p.stock < 1 ? "Sin stock" : "Agregar al carrito"}
                            </button>
                        </div>
                    `;
                });
                contenedor.appendChild(section);
            });
        }

        function agregar(id) {
            const productos = Utils.storage.get("productos") || [];
            const prod = productos.find(x => x.id === id);
            if (!prod || prod.stock < 1) return;

            const existe = carrito.find(x => x.id === id);
            existe ? existe.cantidad++ : carrito.push({...prod, cantidad: 1});

            Utils.storage.set("carrito", carrito);
            Utils.updateCartCounter();
            alert("✅ Agregado");
        }

        function actualizarContador() {
            Utils.updateCartCounter();
        }
    </script>
</body>
</html>
