<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mally Wear - Tienda</title>
    <link rel="stylesheet" href="css/estilos_generales.css">
    <link rel="stylesheet" href="css/estilos_tienda.css">
    <link rel="stylesheet" href="css/estilos_responsivo.css">
</head>
<body>
    <header>
        <h1>Mally Wear</h1>
        <nav>
            <a href="tienda.html">Tienda</a>
            <a href="carrito.html">Carrito (<span id="contador">0</span>)</a>
            <a href="politica_privacidad.html">Políticas</a>
            <a href="../admin/0_acceso_admin.html">Acceso Admin</a>
        </nav>
    </header>

    <main id="contenedor-tienda">
        <p>Cargando productos...</p>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/footer.js"></script>
    <script>
        window.onload = () => {
            Utils.updateCartCounter();
            cargarProductos();
        };

        async function cargarProductos() {
            try {
                const productos = await Utils.api.fetch("/api/productos/");
                const categorias = [...new Set(productos.map(p => p.categoria))];
                if (categorias.length === 0) categorias.push("General");

                const contenedor = document.getElementById("contenedor-tienda");
                contenedor.innerHTML = "";

                categorias.forEach(cat => {
                    const productosCat = productos.filter(p => p.categoria === cat);
                    if (productosCat.length === 0) return;

                    const section = document.createElement("section");
                    section.className = "categoria";
                    section.id = `cat-${cat.toLowerCase().replace(/\s+/g, '-')}`;

                    section.innerHTML = `
                        <h2>${cat}</h2>
                        <div class="productos-lista"></div>
                    `;

                    const lista = section.querySelector(".productos-lista");
                    productosCat.forEach(p => {
                        lista.innerHTML += `
                            <div class="producto" style="display: flex; flex-direction: column; justify-content: space-between;">
                                <div>
                                    <img src="../uploads/productos/${p.imagen}" onerror="this.src='https://via.placeholder.com/150?text=${p.nombre}'" alt="${p.nombre}">
                                    <h3>${p.nombre}</h3>
                                    <p class="precio">${Utils.formatCurrency(p.precio)}</p>
                                    <p class="meta">Stock: ${p.stock} | Unidades: ${p.cantidad_prendas || 1}</p>
                                </div>
                                <a href="producto.html?id=${p.id}" style="display:block; text-align:center; background:#1a1a1a; color:white; padding:12px; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:10px;">
                                    ${p.stock < 1 ? "Ver Detalles" : "Ver / Comprar"}
                                </a>
                            </div>
                        `;
                    });
                    contenedor.appendChild(section);
                });

                if (productos.length === 0) {
                    contenedor.innerHTML = "<p>No hay productos disponibles por el momento.</p>";
                }
            } catch (err) {
                document.getElementById("contenedor-tienda").innerHTML = "<p>Error al cargar productos.</p>";
            }
        }
    </script>
</body>
</html>
